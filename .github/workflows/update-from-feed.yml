name: Update from podcast feed

# Refreshes everything that comes from outside the repo: the podcast feed (new episodes, cover art), your episode
# spreadsheet (verdicts, genres, the "Up next" episode), Wikipedia intros and box art for covers that need one.
# Runs every 4 hours, extra often on Fridays when episodes come out, and any time you press "Run workflow" on the Actions tab.
# If anything changed it commits it and rebuilds the website.
on:
  schedule:
    - cron: "17 */4 * * *"
    - cron: "30 11 * * 5"
    - cron: "30 15 * * 5"
    - cron: "30 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-from-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow numpy

      - name: Update data, cover art and index from the feed
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/update_from_feed.py

      - name: Commit, push and rebuild the website if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          WHAT=""
          git status --porcelain | grep -q "data/episodes.json" && WHAT="$WHAT feed"
          git status --porcelain | grep -q "data/game-info.json" && WHAT="$WHAT spreadsheet"
          git status --porcelain | grep -q "data/next-episode" && WHAT="$WHAT up-next"
          git status --porcelain | grep -q "data/wikipedia-intros.json" && WHAT="$WHAT wikipedia"
          git status --porcelain | grep -q "assets/episode-art" && WHAT="$WHAT art"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-update (${WHAT# })"
          git pull --rebase -X theirs origin main
          git push
          # Commits made with the built-in token don't start other workflows by themselves, so start the rebuild directly.
          gh workflow run deploy-site.yml --ref main
