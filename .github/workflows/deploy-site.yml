name: Deploy website

# Rebuild the site whenever the repo changes. The auto-update workflow starts this itself (with "Run workflow")
# after it commits, because commits made by that workflow don't trigger a normal push event.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history, so the sitemap can show when each episode last changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get install -y fonts-dejavu-core   # fonts for the share-card images

      - run: pip install pillow markdown

      - name: Build the site
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/python/build_site.py

      - name: Build the search index
        run: npx --yes pagefind@1 --site site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
