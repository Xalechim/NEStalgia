name: Announce new episode

# After the website is rebuilt, post any episode that hasn't been announced yet to Discord.
# Needs a repository secret named DISCORD_WEBHOOK_URL (Discord: channel settings > Integrations > Webhooks).
# Without it, this does nothing.
on:
  workflow_run:
    workflows: ["Deploy website"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announce-episode
  cancel-in-progress: false

jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post new episodes to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/discord_post.py

      - name: Remember what was announced
        run: |
          if [ -z "$(git status --porcelain data/discord-posted.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discord-posted.json
          git commit -m "Record Discord announcement [skip ci]"
          git pull --rebase -X theirs origin main
          git push
